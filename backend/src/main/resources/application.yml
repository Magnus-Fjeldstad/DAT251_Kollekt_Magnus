spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/kollekt}
    username: ${SPRING_DATASOURCE_USERNAME:kollekt}
    password: ${SPRING_DATASOURCE_PASSWORD:kollekt}
    hikari:
      auto-commit: false
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 50
          fetch_size: 100
          batch_versioned_data: true
        order_inserts: true
        order_updates: true
        query:
          in_clause_parameter_padding: true
          plan_cache_max_size: 4096
          plan_parameter_metadata_max_size: 256
        connection:
          provider_disables_autocommit: true
    open-in-view: false
  flyway:
    baseline-on-migrate: false
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: kollekt-backend
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: ${SERVER_PORT:8080}
  tomcat:
    max-http-form-post-size: 6MB
    max-swallow-size: 6MB

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  security:
    jwt-secret: ${APP_SECURITY_JWT_SECRET:change-me-to-a-long-random-secret-at-least-32-chars}
    token-validity-seconds: ${APP_SECURITY_TOKEN_VALIDITY_SECONDS:3600}
    refresh-token-validity-seconds: ${APP_SECURITY_REFRESH_TOKEN_VALIDITY_SECONDS:1209600}
  topics:
    task-events: task-events
    chat-events: chat-events
    economy-events: economy-events
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/api/google-calendar/callback}
    frontend-url: ${GOOGLE_FRONTEND_URL:http://localhost:5173}
